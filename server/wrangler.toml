## Minimal Cloudflare Workers config for the BloodBridge backend.
name = "blood-bridge-server"
main = "worker.js"
compatibility_date = "2025-01-01"
preview_urls = false

# Workers Observability: enables Live Logs + metrics for this Worker in the
# Cloudflare dashboard (Workers > blood-bridge-server > Logs / Metrics).
# `head_sampling_rate` is the fraction of requests sampled for traces/logs
# (1.0 = every request; lower it if ingestion volume/cost is a concern).
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Public, non-secret values. Put secrets (below) via `wrangler secret put`.
CLIENT_URL = "http://localhost:5173"

# ---- Optional: durable, cross-isolate rate limiting ----
# Create a KV namespace and uncomment to enable KV-backed rate limiting.
#   npx wrangler kv namespace create RATE_LIMITER
# [[kv_namespaces]]
# binding = "RATE_LIMITER"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"